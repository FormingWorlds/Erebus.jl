# Erebus.jl Planetesimal Simulation Configuration
# Calibrated baseline physical model for thermo-hydro-mechanical evolution

[grid]
xsize = 140000.0        # horizontal domain size [m]
ysize = 140000.0        # vertical domain size [m]
Nx = 33                  # basic grid resolution in x (must match compiled constants)
Ny = 33                  # basic grid resolution in y (must match compiled constants)

[geometry]
rplanet = 50000.0       # planetesimal radius [m]
rcrust = 50000.0        # crust radius [m]
xcenter = 70000.0       # horizontal center [m]
ycenter = 70000.0       # vertical center [m]
psurface = 1.0e+3        # surface pressure anchor [Pa]

[time]
dt_initial = 3168.80878      # initial computational timestep [yr] (~1e11 s)
dt_longest = 3168.80878      # maximum allowed computational timestep [yr] (~1e11 s)
dtcoefdn = 0.5               # coefficient to decrease computational timestep
dtcoefup = 1.2               # coefficient to increase computational timestep
dtstep = 200                 # iterations before changing timestep
dxymax = 0.05                # max marker displacement per timestep [grid units]
vpratio = 0.3333333333333333 # weight of averaged velocity for moving markers
DTmax = 20.0                 # max temperature change per timestep [K]
start_time = 2.25e6          # initial simulation time [yr] (2.25 Ma)
endtime = 15.0e6             # maximum simulation time [yr] (15.0 Ma)
start_step = 1               # starting timestep counter
n_steps = 10                 # total number of timesteps to run

[solver]
titermax = 10000         # maximum global/plastic iterations
nplast = 100000          # maximum plastic iterations
yerrmax = 100.0          # yielding tolerance level
etawt = 0.0              # weight for old viscosity
dphimax = 100.01         # max porosity ratio change per timestep
seed = 42                # random seed for marker initialization
use_pardiso = false      # direct sparse solver selection
etaphikoef = 1.0         # bulk viscosity scaling factor
etamin = 1.0e+12         # lower viscosity cut-off [Pa s]
etamax = 1.0e+23         # upper viscosity cut-off [Pa s]

[poroelasticity]
betasolid = 2.5e-11      # solid silicate matrix compressibility [1/Pa] (production value)
betafluid = 4.0e-10      # pore fluid (water) compressibility [1/Pa] (production value)
phimin = 1.0e-4          # minimum porosity floor [-]
phimax = 0.9999          # maximum porosity ceiling [-]

[thermodynamics]
hr_al = true             # 26Al decay heating active in solid phase
hr_fe = false            # 60Fe decay heating active in fluid phase
ratio_al = 5.0e-5        # initial 26Al/27Al isotope ratio
ratio_fe = 1.0e-6        # initial 60Fe/56Fe isotope ratio
tmsolidphase = 1416.0    # solid phase melting temperature [K]
tmfluidphase = 273.0     # fluid phase melting temperature [K]
phim0 = 0.2              # standard reference porosity [-]

[materials]
# Material index 1: Planetesimal core / mantle
# Material index 2: Porous silicate crust / rock
# Material index 3: Sticky air / space
rhosolidm = [3300.0, 3300.0, 1.0]
rhofluidm = [1000.0, 1000.0, 1.0]
etasolidm = [1.0e+19, 1.0e+19, 1.0e+16]
etasolidmm = [1.0e+19, 1.0e+19, 1.0e+16]
etafluidm = [1.0e+12, 1.0e+12, 1.0e-03]
etafluidmm = [1.0e-03, 1.0e-03, 1.0e-03]
rhocpsolidm = [3.3e+06, 3.3e+06, 3.0e+06]
rhocpfluidm = [1.0e+06, 1.0e+06, 3.0e+06]
alphasolidm = [3.0e-05, 3.0e-05, 0.0]
alphafluidm = [5.0e-05, 5.0e-05, 0.0]
ksolidm = [3.0, 3.0, 3000.0]
kfluidm = [50.0, 50.0, 3000.0]
gggsolidm = [1.0e+10, 1.0e+10, 1.0e+10]
frictsolidm = [0.6, 0.6, 0.0]
cohessolidm = [1.0e+08, 1.0e+08, 1.0e+08]
tenssolidm = [6.0e+07, 6.0e+07, 6.0e+07]
kphim0 = [1.0e-13, 1.0e-13, 1.0e-17]
tkm0 = [170.0, 170.0, 170.0]

[output]
output_dir = "output"
savematstep = 10         # checkpoint storage periodicity
visstep = 1              # visualization cadence
