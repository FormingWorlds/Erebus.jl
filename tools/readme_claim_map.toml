[capabilities]
"Solves coupled two-phase Stokes-Darcy fluid-solid equations on a staggered Eulerian grid." = "test/test_numerics.jl"
"Incorporates poroelastic compressibility from Biot theory for solid and fluid phases." = "test/test_numerics.jl"
"Models visco-elasto-plastic matrix rheology with Drucker-Prager yielding." = "test/test_numerics.jl"
"Couples fluid thermal expansion and temperature-dependent Arrhenius viscosity to Darcy flux." = "test/test_hydrothermal_convection.jl"
"Enhances Darcy permeability via dynamic hydrofracturing under fluid overpressure." = "test/test_hydrofracture_venting.jl"
"Computes radiogenic decay heat from 26Al and 60Fe and silicate reaction kinetics." = "test/test_physics.jl"
"Tracks physical properties with Marker-in-Cell advection (Runge-Kutta 4th-order)." = "test/test_particles.jl"
"Configures geometry, solvers, and physics through validated TOML files." = "test/test_config.jl"

