# Mapping from README claims (capabilities, architecture namespaces, restart claims)
# to corresponding test files or CI jobs.
# Used by tools/check_readme_ci.jl to ensure all README assertions are verified.

[capabilities]
"Solves 2D Cartesian flow for planetesimals in sticky air." = "test/test_geometry.jl"
"Solves viscous and plastic rock matrix flow coupled to Darcy fluid flow with Biot poroelastic compressibility and Drucker-Prager failure." = "test/test_numerics.jl"
"Solves heat conduction, fluid flow, radiogenic heat" = "test/test_physics.jl"
"Tracks rock hydration and dehydration, surface vents, and dynamic hydrofracture permeability" = "test/test_hydrofracture_venting.jl"
"Models rock melting, melt ascent, and liquid metal settling to a central core" = "test/test_melting.jl"
"Conserves elemental budgets (H, C, N, S, O) with ice mixtures" = "test/test_physics.jl"
"Couples a 1D Guillot radiative profile with gas chemistry" = "test/test_atmosphere.jl"
"Models body growth from pebble and embryo impacts" = "test/test_accretion.jl"
"Evaluates gravity fields from a 2D Poisson solve" = "test/test_physics.jl"
"Reads TOML files, writes restart files, streams run metrics" = "test/test_config.jl"

[restart]
"exact bitwise checks for resumed runs on all markers, grid fields, atmosphere, and random seed states" = "test/test_simulation_state.jl"
