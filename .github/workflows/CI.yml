name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Tests - Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - '1.13'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v1
        with:
          cache-registries: "true"
      - uses: julia-actions/julia-buildpkg@v1
      - name: Instantiate tools environment
        run: julia --project=tools -e 'using Pkg; Pkg.instantiate()'
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
        env:
          EREBUS_TEST_GROUP: all

  macos-test:
    name: macOS Quick Simulation - AppleAccelerate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.12'
      - uses: julia-actions/cache@v1
        with:
          cache-registries: "true"
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run 3-step simulation with AppleAccelerate
        run: |
          julia --project -e '
            using Erebus, LinearAlgebra
            cfg = override_config(
                load_config("configs/test_quick.toml"),
                Dict{String,Any}(
                    "time.n_steps" => 3,
                    "solver.hydromech_solver" => "direct",
                    "solver.use_pardiso" => false,
                ),
            )
            @assert cfg.solver.hydromech_solver == :direct
            @assert cfg.solver.use_pardiso == false
            @assert any(lib -> occursin("Accelerate", lib.libname), BLAS.get_config().loaded_libs) "AppleAccelerate BLAS library is not loaded"
            state = run_simulation(cfg)
            @assert state.timestep == 3 "Expected 3 steps completed, got $(state.timestep)"
          '

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.12'
      - uses: julia-actions/cache@v1
      - uses: julia-actions/julia-buildpkg@v1
      - name: Instantiate tools environment
        run: julia --project=tools -e 'using Pkg; Pkg.instantiate()'
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: true
        env:
          EREBUS_TEST_GROUP: all
      - name: Check Coverage
        run: julia --project=tools tools/check_coverage.jl

  docs:
    name: Documentation
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.12'
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # If authenticating with GitHub Actions token
          # DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # If authenticating with SSH deploy key
        run: julia --project=docs/ docs/make.jl
      - name: Verify documentation formatting
        run: julia tools/check_docs_formatting.jl

  format:
    name: Code Style - BlueStyle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.12'
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.add("JuliaFormatter")'
      - name: Check code formatting
        run: |
          julia -e 'using JuliaFormatter; if !format(".", BlueStyle(); overwrite=false, verbose=true) error("Code style check failed: files are not formatted according to BlueStyle! Run using JuliaFormatter; format(\".\", BlueStyle()) locally to fix.") end'

  check_architecture:
    name: Architecture Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.12'
      - uses: julia-actions/cache@v1
        with:
          cache-registries: "true"
      - uses: julia-actions/julia-buildpkg@v1
      - name: Instantiate tools environment
        run: julia --project=tools -e 'using Pkg; Pkg.instantiate()'
      - name: Verify architecture ratchet
        run: julia --project=tools tools/check_architecture.jl --check

  check_budget:
    name: Performance Budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.12'
      - uses: julia-actions/cache@v1
        with:
          cache-registries: "true"
      - uses: julia-actions/julia-buildpkg@v1
      - name: Instantiate tools environment
        run: julia --project=tools -e 'using Pkg; Pkg.instantiate()'
      - name: Verify performance budget
        run: julia --project=tools tools/check_budget.jl --check

  check_determinism:
    name: Bitwise Determinism
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.12'
      - uses: julia-actions/cache@v1
        with:
          cache-registries: "true"
      - uses: julia-actions/julia-buildpkg@v1
      - name: Verify bitwise determinism
        run: julia -t 1 tools/check_determinism.jl

  test-quality:
    name: Test Quality Standards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.12'
      - uses: julia-actions/cache@v1
        with:
          cache-registries: "true"
      - uses: julia-actions/julia-buildpkg@v1
      - name: Instantiate tools environment
        run: julia --project=tools -e 'using Pkg; Pkg.instantiate()'
      - name: Check test quality against baseline
        run: julia --project=tools tools/check_test_quality.jl --check
      - name: Verify literature references
        run: julia tools/verify_references.jl
      - name: Check documentation formatting
        run: julia tools/check_docs_formatting.jl
      - name: Verify documentation numbers
        run: julia tools/check_doc_numbers.jl
      - name: Verify README CI description
        run: julia --project=tools tools/check_readme_ci.jl --check



