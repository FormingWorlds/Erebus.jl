<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #1A1A1A; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #222222; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .box-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; }
      .arrow-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #1A1A1A; }
      .arrow-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 400; fill: #222222; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1A1A1A" />
    </marker>
    <marker id="arrow-cobalt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F4E79" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706" />
    </marker>
    <marker id="arrow-magma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C0392B" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="620" fill="#FFFFFF" rx="8" />
  <rect x="10" y="10" width="980" height="600" fill="none" stroke="#E0E0E0" stroke-width="1" rx="8" />

  <!-- Diagram Title -->
  <text x="40" y="45" class="title">Erebus.jl Volatile Reservoirs and Mass Exchange Architecture</text>
  <text x="40" y="68" class="subtitle">Closed-system elemental tracking, high-temperature speciation, redox buffering, and hydrodynamic escape</text>

  <!-- 1. Disk Gas Envelope Reservoir (Top Left) -->
  <g transform="translate(50, 100)">
    <rect width="250" height="135" rx="6" fill="#F4F7FA" stroke="#1F4E79" stroke-width="1.8" />
    <text x="18" y="28" class="box-title" fill="#1F4E79">Protoplanetary Disk Gas</text>
    <text x="18" y="48" class="box-text" fill="#222222">• Nebular H₂-He background</text>
    <text x="18" y="66" class="box-text" fill="#222222">• Bound envelope M_env_bound</text>
    <text x="18" y="84" class="box-text" fill="#222222">• Gravitational capture (R_cap)</text>
    <text x="18" y="102" class="box-text" fill="#222222">• Photoevaporative boil-off (τ_boil)</text>
    <text x="18" y="120" class="box-text" fill="#222222">• Disk dispersal clearance</text>
  </g>

  <!-- 2. Coupled Atmosphere Reservoir (Center Top) -->
  <g transform="translate(370, 100)">
    <rect width="270" height="230" rx="6" fill="#EDF3F9" stroke="#1F4E79" stroke-width="2.5" />
    <text x="18" y="30" class="box-title" fill="#1F4E79">Coupled 1D Atmosphere</text>
    <text x="18" y="52" class="box-text" fill="#1A1A1A">AtmosphereState (Elemental &amp; Speciated)</text>
    
    <rect x="14" y="62" width="242" height="60" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
    <text x="22" y="80" class="box-text" fill="#1F4E79" font-weight="700">ElementInventory (elem):</text>
    <text x="22" y="98" class="box-text" fill="#222222">H, C, N, S, O [kg] (Conserved)</text>
    <text x="22" y="114" class="box-text" fill="#222222">Machine-precision closure &lt; 10⁻¹²</text>

    <rect x="14" y="130" width="242" height="52" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
    <text x="22" y="148" class="box-text" fill="#1F4E79" font-weight="700">SpeciesInventory (species):</text>
    <text x="22" y="166" class="box-text" fill="#222222">10 gases: H₂O, H₂, CO₂, CO, CH₄,</text>
    <text x="22" y="178" class="box-text" fill="#222222">N₂, NH₃, H₂S, S₂, SO₂ [kg]</text>

    <text x="18" y="202" class="box-text" fill="#222222">• Equilibrium log₁₀ fO₂ &amp; dO_buffer</text>
    <text x="18" y="220" class="box-text" fill="#222222">• Radiative Guillot P_surf &amp; T_surf_eq</text>
  </g>

  <!-- 3. Space / Escaped Reservoir (Top Right) -->
  <g transform="translate(710, 100)">
    <rect width="240" height="155" rx="6" fill="#FFF6F0" stroke="#D97706" stroke-width="1.8" />
    <text x="18" y="28" class="box-title" fill="#D97706">Space / Escaped Reservoir</text>
    <text x="18" y="48" class="box-text" fill="#222222">ElementInventory (escaped)</text>
    <text x="18" y="68" class="box-text" fill="#222222">• Transonic blow-off (λ &lt; 1)</text>
    <text x="18" y="86" class="box-text" fill="#222222">• Kinetic Jeans effusion (λ ≥ 2)</text>
    <text x="18" y="104" class="box-text" fill="#222222">• XUV energy-limited loss</text>
    <text x="18" y="122" class="box-text" fill="#222222">• Multispecies crossover diffusion</text>
    <text x="18" y="140" class="box-text" fill="#222222">• Heavy trace drag / fractionation</text>
  </g>

  <!-- 4. Magma Ocean Reservoir (Middle Left) -->
  <g transform="translate(50, 390)">
    <rect width="250" height="165" rx="6" fill="#FDF3F2" stroke="#C0392B" stroke-width="1.8" />
    <text x="18" y="28" class="box-title" fill="#C0392B">Surface Magma Ocean</text>
    <text x="18" y="48" class="box-text" fill="#222222">Lagrangian Silicate Melt Markers</text>
    <text x="18" y="68" class="box-text" fill="#222222">• Melt fraction F_melt ≥ F_thresh</text>
    <text x="18" y="86" class="box-text" fill="#222222">• HCNS solubility equilibrium laws</text>
    <text x="18" y="104" class="box-text" fill="#222222">• Dixon (1995) H₂O &amp; CO₂</text>
    <text x="18" y="122" class="box-text" fill="#222222">• Libourel (2003) N₂ solubility</text>
    <text x="18" y="140" class="box-text" fill="#222222">• O'Neill (2002) sulfide/sulfate S</text>
    <text x="18" y="156" class="box-text" fill="#222222">• Signed resorption transfer (V4)</text>
  </g>

  <!-- 5. Mantle & Crustal Interior (Middle Center/Right) -->
  <g transform="translate(370, 390)">
    <rect width="270" height="165" rx="6" fill="#F9F5F8" stroke="#6C3483" stroke-width="1.8" />
    <text x="18" y="28" class="box-title" fill="#6C3483">Porous Mantle &amp; Crust</text>
    <text x="18" y="48" class="box-text" fill="#222222">Two-Phase Stokes-Darcy Matrix</text>
    <text x="18" y="68" class="box-text" fill="#222222">• Serpentine &amp; clay mineral water</text>
    <text x="18" y="86" class="box-text" fill="#222222">• Porous Darcy fluid transport (φ)</text>
    <text x="18" y="104" class="box-text" fill="#222222">• Hydrothermal convection cells</text>
    <text x="18" y="122" class="box-text" fill="#222222">• Retention drainage ceilings</text>
    <text x="18" y="140" class="box-text" fill="#222222">• Redox buffer (3 FeO + ½ O₂ ↔ Fe₃O₄)</text>
    <text x="18" y="156" class="box-text" fill="#222222">• Marker oxygen exchange ΔO_buffer</text>
  </g>

  <!-- 6. Metallic Core Reservoir (Bottom Right) -->
  <g transform="translate(710, 390)">
    <rect width="240" height="165" rx="6" fill="#F5F4F6" stroke="#222222" stroke-width="1.8" />
    <text x="18" y="28" class="box-title" fill="#222222">Segregated Metallic Core</text>
    <text x="18" y="48" class="box-text" fill="#222222">Siderophile Metal Alloy (Fe-Ni)</text>
    <text x="18" y="68" class="box-text" fill="#222222">• Fe-FeS eutectic melting (1213 K)</text>
    <text x="18" y="86" class="box-text" fill="#222222">• Darcy percolation &amp; Stokes settling</text>
    <text x="18" y="104" class="box-text" fill="#222222">• Siderophile volatile sequestration</text>
    <text x="18" y="122" class="box-text" fill="#222222">• Core partitioning: S, C, H, N</text>
    <text x="18" y="140" class="box-text" fill="#222222">• Troilite &amp; accessory crystallization</text>
    <text x="18" y="156" class="box-text" fill="#222222">• Deep planetary isolation</text>
  </g>

  <!-- Flow Arrows & Labels -->

  <!-- Disk <-> Atmosphere -->
  <path d="M 300 155 L 360 155" fill="none" stroke="#1F4E79" stroke-width="2" marker-end="url(#arrow-cobalt)" />
  <path d="M 360 175 L 300 175" fill="none" stroke="#1F4E79" stroke-width="2" marker-end="url(#arrow-cobalt)" />
  <text x="310" y="145" class="arrow-text" fill="#1F4E79">Capture</text>
  <text x="312" y="195" class="arrow-text" fill="#1F4E79">Boil-Off</text>

  <!-- Atmosphere -> Space Escape -->
  <path d="M 640 165 L 700 165" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-amber)" />
  <text x="646" y="150" class="arrow-text" fill="#D97706">Escape Loss</text>
  <text x="646" y="185" class="arrow-sub">debit elem</text>
  <text x="646" y="197" class="arrow-sub">credit escaped</text>

  <!-- Magma Ocean <-> Atmosphere -->
  <path d="M 230 390 L 380 335" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#arrow-magma)" />
  <path d="M 390 345 L 245 402" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#arrow-magma)" />
  <text x="235" y="345" class="arrow-text" fill="#C0392B">Equilibrium Degassing</text>
  <text x="245" y="360" class="arrow-sub">Signed Resorption (dM &lt; 0)</text>

  <!-- Mantle Venting -> Atmosphere -->
  <path d="M 480 390 L 480 340" fill="none" stroke="#6C3483" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="490" y="365" class="arrow-text" fill="#6C3483">Hydrothermal Venting</text>
  <text x="490" y="380" class="arrow-sub">Darcy Pore &amp; Drainage</text>

  <!-- Mantle <-> Atmosphere Redox Buffer Exchange -->
  <path d="M 530 390 L 530 340" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <text x="540" y="365" class="arrow-text">ΔO_buffer</text>
  <text x="540" y="380" class="arrow-sub">3 FeO + ½ O₂ ↔ Fe₃O₄</text>

  <!-- Mantle -> Core Differentiation -->
  <path d="M 640 470 L 700 470" fill="none" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="645" y="455" class="arrow-text">Metal Partitioning</text>
  <text x="645" y="490" class="arrow-sub">Core Percolation</text>
</svg>
